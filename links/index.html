  <script>
  /* 移动端侧边栏：checkbox 驱动展开/收回 */
  (function() {
    var toggle = document.getElementById('nav-toggle');
    if (!toggle) return;
    var sidebar = document.getElementById('sidebar');
    var label = document.querySelector('.sidebar-mobile-toggle');
    var overlay = document.getElementById('sidebarOverlay');
    if (!sidebar || !label || !overlay) return;

    function closeNav() {
      toggle.checked = false;
    }
    function openNav() {
      toggle.checked = true;
    }

    /* 点击汉堡 → 手动切换（阻止原生 label-for 行为，避免重复触发） */
    label.addEventListener('click', function(e) {
      e.preventDefault();
      toggle.checked ? closeNav() : openNav();
    });

    /* 点击导航链接或搜索按钮 → 收回 */
    sidebar.addEventListener('click', function(e) {
      if (e.target.closest('a') || e.target.closest('button')) {
        closeNav();
      }
    });

    /* 点击遮罩 → 收回 */
    overlay.addEventListener('click', function() {
      closeNav();
    });
  })();
  </script>

  <script>
  (function() {
    var main = document.querySelector('main');
    if (!main) return;

    function reinitComments(container) {
      var commentEl = container.querySelector('#tcomment');
      if (!commentEl) return;

      // Twikoo
      if (typeof twikoo !== 'undefined') {
        // 若已被内联脚本初始化，跳过（避免 double init）
        if (commentEl._twikooInited) {
          delete commentEl._twikooInited;
          return;
        }
        commentEl.innerHTML = '';
        var script = container.querySelector('#tcomment + script');
        if (script && script.textContent) {
          var match = script.textContent.match(/envId:\s*'([^']+)'/);
          if (match) {
            twikoo.init({ envId: match[1], el: '#tcomment' });
          }
        }
        return;
      }

      // Waline
      if (typeof Waline !== 'undefined') {
        var walineEl = container.querySelector('#waline');
        if (walineEl) {
          while (walineEl.firstChild) walineEl.removeChild(walineEl.firstChild);
          // Waline 需要 serverURL，由已执行的 inline script 处理
        }
        return;
      }

      // 其他评论平台的兜底逻辑可按需扩展
    }

    function sameOrigin(href) {
      try { var u = new URL(href, location.origin); return u.origin === location.origin; }
      catch(e) { return false; }
    }

    function load(url, push) {
      main.classList.add('is-loading');
      fetch(url)
        .then(function(r) { return r.text(); })
        .then(function(html) {
          var doc = new DOMParser().parseFromString(html, 'text/html');
          var newMain = doc.querySelector('main');
          var newTitle = doc.querySelector('title');
          if (!newMain) return;

          main.innerHTML = newMain.innerHTML;
          main.classList.remove('is-loading');

          if (push) history.pushState({url: url}, '', url);

          // 重新执行内联脚本（innerHTML 不会自动执行 <script>）
          var scripts = main.querySelectorAll('script');
          scripts.forEach(function(s) {
            var ns = document.createElement('script');
            ns.textContent = s.textContent;
            s.parentNode.replaceChild(ns, s);
          });

          // PJAX 后重新初始化评论区
          reinitComments(main);

          // 重新绑定 Fancybox（如果文章有图片）
          if (typeof Fancybox !== 'undefined') {
            Fancybox.bind('[data-fancybox]');
          }

          if (newTitle) document.title = newTitle.textContent;

          // 切换页面后自动回到顶部
          window.scrollTo({ top: 0, behavior: 'smooth' });

          // 重新标记当前页面对应的侧边栏链接
          var links = document.querySelectorAll('.sidebar-link');
          var path = window.location.pathname.replace(/\/+$/, '') || '/';
          links.forEach(function(a) {
            a.classList.remove('active');
            var href = a.getAttribute('href').replace(/\/+$/, '') || '/';
            if (href === path || (path !== '/' && href !== '/' && path.indexOf(href) === 0)) {
              a.classList.add('active');
            }
          });
        })
        .catch(function() {
          main.classList.remove('is-loading');
          location.href = url;
        });
    }

    document.addEventListener('click', function(e) {
      var a = e.target.closest('a');
      if (!a) return;
      var href = a.getAttribute('href');
      if (!href || href[0] === '#' || a.getAttribute('download') !== null) return;
      if (a.getAttribute('target') === '_blank') return;
      if (!sameOrigin(href)) return;
      if (a.getAttribute('rel') === 'alternate') return;

      e.preventDefault();
      load(href, true);
    });

    window.addEventListener('popstate', function(e) {
      if (e.state && e.state.url) load(e.state.url, false);
    });
  })();
  </script>
